version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
      day: friday
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      flake-inputs:
        patterns: ["*"]
    ignore:
      # Pinned to the nixpkgs release that ships Neovim 0.11.x; CI asserts the
      # devshell's `vim.version()` is exactly 0.11, so a newer channel fails by
      # design. Block channel bumps (25.11 -> 26.05); flake.lock revs on the
      # pinned branch still get updated.
      - dependency-name: nixpkgs-neovim-0_11
        versions: ["> 25.11"]
