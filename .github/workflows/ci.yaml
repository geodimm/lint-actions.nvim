name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.version.outputs.current }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        name: Find current version
        run: |
          current="$(git tag --list 'v[0-9]*' --sort=-v:refname \
            | sed -nE '/^v[0-9]+\.[0-9]+\.[0-9]+$/p' \
            | head -n 1)"
          current="${current:-unreleased}"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          {
            echo '## Version'
            echo
            echo "Current release: \`$current\`"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check formatting
        run: nix develop .#ci --command just fmt-check

      - name: Check generated docs
        run: nix develop .#ci --command just docs-check

      - name: Run Luacheck
        run: nix develop .#ci --command just lint

      - name: Run LuaLS
        run: nix develop .#ci --command just typecheck

  test:
    name: Test Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: ['0.11', stable, nightly]
        include:
          - neovim: '0.11'
            devshell: ci-0_11
          - neovim: stable
            devshell: ci
          - neovim: nightly
            devshell: ci-nightly
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Update Neovim nightly
        if: matrix.neovim == 'nightly'
        run: nix flake update neovim-nightly-overlay

      - name: Check Neovim version
        run: |
          nix develop .#${{ matrix.devshell }} --command nlua -e '
            local v, want = vim.version(), "${{ matrix.neovim }}"
            print("Neovim " .. tostring(v))
            if want == "nightly" then
              assert(v.prerelease, "expected a Neovim prerelease")
            elseif want == "stable" then
              assert(not v.prerelease, "expected a Neovim release")
            else
              local got = ("%d.%d"):format(v.major, v.minor)
              assert(got == want and not v.prerelease, "expected Neovim " .. want)
            end
          ' < /dev/null

      - name: Run tests
        run: nix develop .#${{ matrix.devshell }} --command just test

  release:
    name: Prepare or publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Write release summary
        env:
          CURRENT_VERSION: ${{ needs.version.outputs.current }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_URL: ${{ steps.release.outputs.html_url }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          {
            echo '## Release'
            echo
            if [[ "$RELEASE_CREATED" == 'true' ]]; then
              echo "Published: [\`$TAG_NAME\`]($RELEASE_URL)"
              echo
              echo "Version: \`$RELEASE_VERSION\`"
            else
              echo "Current release: \`$CURRENT_VERSION\`"
              echo
              echo 'No release was published. Release Please will open or update a release PR when commits are releasable.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
